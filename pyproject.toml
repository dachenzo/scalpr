[project]
name = "scalpr"
version = "0.1.0"
description = "A tool for converting bag files of hands into 4d hand cordinates"
authors = [
    {name = "Michael Okeke",email = "michaelokeke101@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pyrealsense2 (>=2.56.5.9235,<3.0.0.0)",
    "numpy (<2)",
    "mediapipe (==0.10.21)",
    "opencv-python (>=4.10,<5.0)",
    "pillow (>=12.0.0,<13.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "torch (>=2.10.0,<3.0.0)",
    "torchvision (>=0.25.0,<0.26.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
